<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etch-a-Sketch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Etch-a-Sketch</h1>
  <div class="size-selector">
    How many squares?
    <input id="slider" type="range" min="1" max="64" value="10">
    <p>Size <span id="size-text">10</span> grid</p>
  </div>
  <div class="container">
    <div class="window-bar">
      <img src="images/paintbrush.png">
      <h2>Exosoft Paintbrush</h2>
    </div>
    <div id="grid"></div>
  </div>
  <div class="footer">
    Page by Exocet1. Project by The Odin Project.
  </div>
  <!--  -->
  <script src="script.js"></script>
</body>
</html>
